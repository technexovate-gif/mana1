<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manar ❤ بحبك</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Message page extra styles */
        .message-card {
            max-width: 550px;
            width: 100%;
            padding: 60px 45px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .message-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(201, 169, 110, 0.05) 0%, transparent 50%);
            animation: glowRotate 10s linear infinite;
            pointer-events: none;
        }

        @keyframes glowRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .message-card .heart-main {
            font-size: 5rem;
            display: block;
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
            animation: heartBeat 1.5s ease-in-out infinite;
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.3); }
            70% { transform: scale(1); }
        }

        .message-card .main-text {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--gold-light);
            line-height: 1.6;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
            text-shadow: 0 0 30px rgba(201, 169, 110, 0.2);
        }

        .message-card .sub-text {
            font-size: 1.1rem;
            color: var(--pink);
            line-height: 1.8;
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
            opacity: 0.85;
        }

        .message-card .divider {
            width: 150px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 25px auto;
            position: relative;
            z-index: 1;
        }

        .message-card .quote {
            font-family: 'Amiri', serif;
            font-size: 1.1rem;
            color: rgba(255, 248, 240, 0.7);
            line-height: 1.8;
            margin-bottom: 35px;
            position: relative;
            z-index: 1;
        }

        .message-card .btn {
            position: relative;
            z-index: 1;
            padding: 18px 45px;
            font-size: 1.2rem;
        }

        .message-card .floating-hearts {
            position: absolute;
            font-size: 1.2rem;
            color: var(--pink);
            opacity: 0.2;
            z-index: 0;
        }

        .message-card .floating-hearts:nth-child(1) { top: 10%; left: 5%; animation: floatHeart 4s ease-in-out infinite; }
        .message-card .floating-hearts:nth-child(2) { top: 20%; right: 8%; animation: floatHeart 5s ease-in-out infinite 1s; }
        .message-card .floating-hearts:nth-child(3) { bottom: 15%; left: 10%; animation: floatHeart 4.5s ease-in-out infinite 0.5s; }
        .message-card .floating-hearts:nth-child(4) { bottom: 25%; right: 5%; animation: floatHeart 5.5s ease-in-out infinite 1.5s; }

        @keyframes floatHeart {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.2; }
            50% { transform: translateY(-20px) rotate(10deg); opacity: 0.4; }
        }

        @media (max-width: 480px) {
            .message-card {
                padding: 40px 20px;
            }
            .message-card .main-text {
                font-size: 1.5rem;
            }
            .message-card .heart-main {
                font-size: 3.5rem;
            }
            .message-card .sub-text {
                font-size: 0.95rem;
            }
            .message-card .btn {
                padding: 15px 30px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Falling Hearts Background -->
    <div id="hearts-container"></div>

    <!-- Page Transition Overlay -->
    <div id="page-transition" class="page-transition"></div>

    <!-- Message Card -->
    <div class="page-container">
        <div class="message-card glass-card">
            <!-- Floating decorative hearts -->
            <span class="floating-hearts">💗</span>
            <span class="floating-hearts">💖</span>
            <span class="floating-hearts">💕</span>
            <span class="floating-hearts">💝</span>

            <span class="heart-main">💖</span>
            
            <h1 class="main-text">بحبك يا أحلى إنسانة شافتها عيوني ❤</h1>
            
            <p class="sub-text">
                من يوم ما شفتك، الدنيا بقت أحلى<br>
                وكل لحظة معاكي وردة في جنة<br>
                أنتي أجمل حاجة في حياتي يا منار 🌹
            </p>
            
            <div class="divider"></div>
            
            <p class="quote">
                "وَمِن كُلِّ شَيْءٍ خَلَقْنَا زَوْجَيْنِ لَعَلَّكُمْ تَذَكَّرُونَ"<br>
                الحمدلله إنه خلقك ليا 💕
            </p>

            <button id="message-btn" class="btn btn-gold">
                انتقلي لراوي قصتنا ➔ 💫
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
